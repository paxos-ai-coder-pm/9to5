<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening your project…</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body class="launch-page">
  <main class="launch" aria-live="polite">
    <div class="launch-brand">
      <svg class="logo-tile" viewBox="0 0 44 44" width="32" height="32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">
        <rect width="44" height="44" fill="var(--warning)"/>
        <rect x="0" y="0" width="44" height="2" fill="rgba(255,255,255,0.28)"/>
        <rect x="0" y="0" width="2" height="44" fill="rgba(255,255,255,0.28)"/>
        <rect x="0" y="42" width="44" height="2" fill="rgba(0,0,0,0.18)"/>
        <rect x="42" y="0" width="2" height="44" fill="rgba(0,0,0,0.18)"/>
        <text x="22" y="22" text-anchor="middle" dominant-baseline="central"
          font-family="'Press Start 2P', monospace" font-size="10"
          fill="var(--on-accent)" letter-spacing="1">VDS</text>
      </svg>
      <span class="launch-studio-name">VIKRANT'S DEV STUDIO</span>
    </div>
    <h1 id="title">OPENING…</h1>
    <p class="launch-status" id="status">Starting…</p>
    <div class="launch-spinner" id="spinner" aria-hidden="true"><i></i><i></i><i></i></div>
    <ol class="launch-steps" id="steps" hidden></ol>
    <pre class="launch-log" id="log" hidden></pre>
    <details class="launch-details" id="details" hidden><summary>Technical details</summary><pre id="detailsLog"></pre></details>
    <div class="launch-actions" id="actions"></div>
    <p class="launch-back"><a href="/">← Back to the studio</a></p>
  </main>
  <script type="module" src="/launch.js"></script>
</body>
</html>
