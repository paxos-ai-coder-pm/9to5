name: tests
on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: which browser takes the screenshots
        shell: bash
        run: |
          for b in google-chrome google-chrome-stable chromium chromium-browser "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if command -v "$b" >/dev/null 2>&1 || [ -x "$b" ]; then echo "$b: $("$b" --version 2>&1 | head -1)"; fi
          done
      - run: npm test

  windows:
    # the integration tests drive a fake `claude` script, which needs a POSIX shell; they skip themselves here
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node --test --test-concurrency=1 tools/team-office/test/unit.test.mjs tools/team-office/test/team-cli.test.mjs

  ui:
    name: browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
